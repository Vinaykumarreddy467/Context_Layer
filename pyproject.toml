[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-layer"
version = "0.1.0"
description = "Persistent, model-agnostic context storage for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "surrealdb>=3.0.0b8",
    "mcp[cli]>=1.0,<2",
    "anthropic>=0.40",
    "fastembed>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "tiktoken>=0.7"]

[project.scripts]
context-layer-mcp = "context_layer.server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["context_layer*"]
